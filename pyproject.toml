[project]
name = "filipino-news-scraper"
version = "0.1.0"
description = "High-quality Filipino news article and sentence crawler/scraper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "readability-lxml>=0.8.1",
    "sqlalchemy>=2.0.27",
    "httpx>=0.27.0",
    "lingua-language-detector>=2.0.2",
    "simhash>=2.1.2",
    "apscheduler>=3.10.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
trafilatura = ["trafilatura>=1.9.0"]
